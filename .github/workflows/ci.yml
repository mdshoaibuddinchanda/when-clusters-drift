name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test & Scientific Verification (Python 3.12, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify Hypothesis-Y1 Master Audit & Falsification Suite
        run: |
          pytest tests/test_falsification/ experiments/hypothesis_y1/tests/ -v --tb=short

      - name: Verify Core Algorithms, Alignment, and Signals
        run: |
          pytest tests/test_alignment/ tests/test_methods/ tests/test_signals/ tests/test_synthetic_reproducibility.py tests/test_synthetic_soft_truth.py tests/test_metric_correctness.py -v --tb=short

