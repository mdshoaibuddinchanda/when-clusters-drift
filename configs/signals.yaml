# Phase 6 Structural Signal Engine and Conventional Validity Controls Configuration
protocol_version: 1
signal_definition_version: 1

global_signal_seed: 2026090706

js:
  log_base: natural
  normalize_by_ln2: true
  epsilon: 1.0e-15

prototype_movement:
  normalization: reference_cluster_rms_radius
  epsilon: 1.0e-12
  aggregation: mean

entropy:
  normalize_by_lnK: true
  primary: absolute_current_model_difference

cluster_mass:
  metric: normalized_jensen_shannon
  bank: current

mmd:
  kernel: rbf
  estimator: biased
  bandwidth: source_reference_median
  bandwidth_max_points: 1024
  chunk_size: 512
  negative_tolerance: 1.0e-10

validity:
  bank: current
  model: deployed_source
  xb_control_m: 2.0

validation:
  datasets:
    - iris
    - glass
    - sonar
    - madelon
    - human_activity_recognition
    - mice_protein_expression

  outer_fold: 0

  conditions:
    - clean
    - location_severe
    - scale_severe
    - mcar_severe
    - outliers_severe
    - measurement_noise_severe
    - class_prevalence_severe
    - local_overlap_severe

  methods:
    - fcm_adaptive
    - gmm

  algorithm_seeds:
    - 1
    - 3

execution:
  jobs: auto
  cache_preprocessors: true
  cache_source_models: true
  cache_probe_matrices: true
  cache_reference_memberships: true
  cache_mmd_source_kernel_sum: true
  canonical_backend: numpy_float64
