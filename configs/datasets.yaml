synthetic_datasets:
  s01_balanced_gmm:
    family_id: s01_balanced_gmm
    generator: balanced_gmm
    generator_seed: 1001
    K: 3
    n: 10000
    d: 10
    notes: Balanced well-separated Gaussian mixture with spherical covariance.
    parameters:
      separation: 3.5
      covariance_scale: 1.0
  s02_overlap_gmm:
    family_id: s02_overlap_gmm
    generator: overlap_gmm
    generator_seed: 1002
    K: 3
    n: 10000
    d: 10
    notes: Overlapping Gaussian mixture with reduced separation to test membership
      ambiguity.
    parameters:
      separation: 1.2
      covariance_scale: 1.0
  s03_imbalanced_gmm:
    family_id: s03_imbalanced_gmm
    generator: imbalanced_gmm
    generator_seed: 1003
    K: 3
    n: 10000
    d: 10
    notes: Gaussian mixture with severe cluster prior imbalance.
    parameters:
      priors:
      - 0.7
      - 0.2
      - 0.1
      separation: 3.0
  s04_heteroscedastic_gmm:
    family_id: s04_heteroscedastic_gmm
    generator: heteroscedastic_gmm
    generator_seed: 1004
    K: 3
    n: 10000
    d: 10
    notes: Gaussian mixture with unequal cluster covariance variances.
    parameters:
      variances:
      - 0.5
      - 1.5
      - 3.0
      separation: 3.5
  s05_anisotropic_gmm:
    family_id: s05_anisotropic_gmm
    generator: anisotropic_gmm
    generator_seed: 1005
    K: 3
    n: 10000
    d: 10
    notes: Rotated non-spherical clusters violating standard Euclidean distance assumptions.
    parameters:
      eccentricity: 4.0
      separation: 3.5
  s06_high_dimensional_gmm:
    family_id: s06_high_dimensional_gmm
    generator: high_dimensional_gmm
    generator_seed: 1006
    K: 5
    n: 10000
    d: 100
    notes: High-dimensional Gaussian mixture testing curse of dimensionality.
    parameters:
      separation: 4.0
      covariance_scale: 1.0
  s07_irrelevant_features_gmm:
    family_id: s07_irrelevant_features_gmm
    generator: irrelevant_features_gmm
    generator_seed: 1007
    K: 4
    n: 10000
    d: 100
    notes: 20 informative cluster dimensions embedded within 80 standard Gaussian
      noise dimensions.
    parameters:
      informative_d: 20
      noise_d: 80
      separation: 3.5
  s08_student_t_mixture:
    family_id: s08_student_t_mixture
    generator: student_t_mixture
    generator_seed: 1008
    K: 3
    n: 10000
    d: 10
    notes: Heavy-tailed Student-t mixture with df=3 inducing natural outlier behavior.
    parameters:
      df: 3.0
      separation: 3.5
