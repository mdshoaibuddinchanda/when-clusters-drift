[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clusterdrift"
version = "0.1.0"
description = "When Clusters Drift: Label-Free Failure Prediction and Risk-Guided Adaptation for Soft Clustering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "mdshoaibuddinchanda" }
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyarrow>=12.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "pydantic>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
sources = [
    "ucimlrepo>=0.0.7",
    "whyshift>=0.1.4",
]
tableshift = [
    "tableshift",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

